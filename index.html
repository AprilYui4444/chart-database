<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>譜面資料庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: sticky filter bar over a jacket wall; each chart is a square cover with its constant printed large beneath.
   Version colors are the ones used in the source spreadsheet (pink / blue / green). */
:root {
  --bg: #eceef5;
  --surface: #ffffff;
  --surface-2: #e2e6f1;
  --ink: #12152a;
  --ink-2: #50577a;
  --line: #cfd5e6;
  --on-ink: #f6f7fc;
  --v1: #ff66cc;
  --v2: #00b0f0;
  --v3: #00b050;
  --on-v: #10121c;
  --focus: #1d4ed8;
  --shadow: 0 10px 30px rgb(18 21 42 / .16);
  --display: "Chakra Petch", "Noto Sans TC", system-ui, sans-serif;
  --body: "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f19; --surface: #161a28; --surface-2: #212640; --ink: #eceef8; --ink-2: #9ba2c2;
    --line: #2a3050; --on-ink: #0d0f19; --focus: #7aa2ff; --shadow: 0 10px 30px rgb(0 0 0 / .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f19; --surface: #161a28; --surface-2: #212640; --ink: #eceef8; --ink-2: #9ba2c2;
  --line: #2a3050; --on-ink: #0d0f19; --focus: #7aa2ff; --shadow: 0 10px 30px rgb(0 0 0 / .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--body); padding-inline: 16px; padding-block: 20px 40px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1240px; margin-inline: auto; display: grid; gap: 18px; }

/* header */
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.eyebrow { margin: 0; font: 500 12px/1 var(--mono); letter-spacing: .08em; color: var(--ink-2); }
h1 { margin: 6px 0 0; font: 700 clamp(30px, 6vw, 46px)/1.05 var(--display); letter-spacing: .02em; text-wrap: balance; }
.vers { display: flex; flex-wrap: wrap; gap: 8px; }
.ver { --vc: var(--ink-2); display: grid; gap: 2px; text-align: left; min-width: 118px; padding: 9px 12px 10px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--vc); border-radius: 8px; }
.ver[data-v="1"] { --vc: var(--v1); } .ver[data-v="2"] { --vc: var(--v2); } .ver[data-v="3"] { --vc: var(--v3); }
.ver b { font: 700 15px/1.2 var(--display); }
.ver span { font: 400 11px/1.3 var(--mono); color: var(--ink-2); }
.ver[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.ver[aria-pressed="true"] span { color: var(--on-ink); opacity: .75; }

/* controls */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.search { flex: 1 1 200px; min-width: 0; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.search::placeholder { color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.seg button { height: 34px; padding: 0 12px; border: 0; background: transparent; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.sel { height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); max-width: 100%; }
.meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--ink-2); font: 400 12px/1.4 var(--mono); }

/* card grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
.card { --vc: var(--ink-2); display: flex; flex-direction: column; min-width: 0; padding: 0; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; transition: transform .15s ease, border-color .15s ease; }
.card[data-v="1"], .row[data-v="1"] { --vc: var(--v1); } .card[data-v="2"], .row[data-v="2"] { --vc: var(--v2); } .card[data-v="3"], .row[data-v="3"] { --vc: var(--v3); }
.card:hover { transform: translateY(-2px); border-color: var(--ink-2); }
.art { position: relative; aspect-ratio: 1 / 1; max-width: 100%; overflow: hidden;
  background: repeating-linear-gradient(0deg, rgb(255 255 255 / .07) 0 1px, transparent 1px 18px),
    linear-gradient(140deg, hsl(var(--h) 50% 40%), hsl(calc(var(--h) + 38) 56% 22%)); }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ini { position: absolute; inset: 0; display: grid; place-items: center; font: 700 clamp(48px, 9vw, 84px)/1 var(--display); color: rgb(255 255 255 / .3); }
.card { border-top: 4px solid var(--vc); }
.lockmsg { margin: 14px 0 10px; color: var(--ink-2); font-size: 14px; }
.unlock { height: 40px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--ink-2); background: var(--surface); font-weight: 700; }
.lockicon { position: absolute; left: 50%; top: 50%; width: 42%; aspect-ratio: 1; margin: -21% 0 0 -21%; color: #eaf6ff; }
.lockicon svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.lockicon .g1 { color: #00f0ff; mix-blend-mode: screen; transform: translate(-3%, 0); animation: gl1 2.6s steps(1) infinite; }
.lockicon .g2 { color: #ff2bd6; mix-blend-mode: screen; transform: translate(3%, 0); animation: gl2 2.6s steps(1) infinite; }
.lockicon .base { animation: glbase 2.6s steps(1) infinite; }
.lockicon .shackle { transform-origin: 16px 11px; transition: transform .35s steps(4); }
.lockicon.open .base { color: #9bffc0; }
.lockicon.open .shackle { transform: translateY(-3px) rotate(-28deg); }
.lockicon.open { animation: glburst .75s steps(1); }
.lockicon.nope { animation: glburst .45s steps(1); }
.lockicon.nope .base { color: #ff6b6b; }
.lockicon.slam { animation: glburst .4s steps(1); }
@keyframes gl1 { 0% { transform: translate(-3%, 0); clip-path: inset(0); } 8% { transform: translate(-12%, 0); clip-path: inset(8% 0 58% 0); } 10% { transform: translate(8%, 0); clip-path: inset(62% 0 6% 0); } 12% { transform: translate(-3%, 0); clip-path: inset(0); } 41% { transform: translate(-9%, 2%); clip-path: inset(30% 0 38% 0); } 44% { transform: translate(-3%, 0); clip-path: inset(0); } 72% { transform: translate(14%, -2%); clip-path: inset(0 0 72% 0); } 75% { transform: translate(-3%, 0); clip-path: inset(0); } }
@keyframes gl2 { 0% { transform: translate(3%, 0); clip-path: inset(0); } 9% { transform: translate(12%, 0); clip-path: inset(50% 0 20% 0); } 11% { transform: translate(-8%, 0); clip-path: inset(5% 0 70% 0); } 13% { transform: translate(3%, 0); clip-path: inset(0); } 42% { transform: translate(9%, -2%); clip-path: inset(55% 0 12% 0); } 45% { transform: translate(3%, 0); clip-path: inset(0); } 73% { transform: translate(-14%, 2%); clip-path: inset(68% 0 0 0); } 76% { transform: translate(3%, 0); clip-path: inset(0); } }
@keyframes glbase { 0% { transform: none; opacity: 1; } 9% { transform: translate(4%, 0); opacity: .55; } 10% { transform: translate(-3%, 1%); opacity: 1; } 11% { transform: none; } 41% { transform: translate(-5%, 0); opacity: .35; } 43% { transform: none; opacity: 1; } 72% { transform: skewX(14deg) translate(3%, 0); } 74% { transform: none; } 90% { opacity: .6; } 91% { opacity: 1; } }
@keyframes glburst { 0% { transform: translate(-8%, 3%) skewX(-10deg); } 20% { transform: translate(7%, -3%) skewX(12deg); } 40% { transform: translate(-5%, 1%); } 60% { transform: translate(6%, 2%) skewX(-8deg); } 80% { transform: translate(-3%, -1%); } 100% { transform: none; } }
.panel.reveal .art { animation: revealart 1s steps(1) both; }
.panel.reveal dl > div, .panel.reveal .big { animation: revealin .6s steps(6) both; animation-delay: calc(var(--i, 0) * 80ms + 300ms); }
@keyframes revealart { 0% { clip-path: inset(0 0 100% 0); filter: contrast(3) hue-rotate(90deg); } 10% { clip-path: inset(0 0 82% 0); transform: translateX(-4%); } 20% { clip-path: inset(40% 0 30% 0); transform: translateX(5%); filter: drop-shadow(-6px 0 #0ff) drop-shadow(6px 0 #f2d); } 30% { clip-path: inset(0 0 45% 0); transform: translateX(-3%); } 45% { clip-path: inset(0 0 12% 0); transform: none; filter: hue-rotate(60deg) contrast(1.6); } 60% { clip-path: inset(0); transform: translateX(2%); filter: drop-shadow(3px 0 #f2d) drop-shadow(-3px 0 #0ff); } 78% { transform: translateX(-1%); filter: saturate(2); } 100% { clip-path: inset(0); transform: none; filter: none; } }
@keyframes revealin { 0% { opacity: 0; transform: translateX(-6px); } 50% { opacity: .5; transform: translateX(4px); } 100% { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .panel.reveal * { animation: none !important; } }
.scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgb(0 0 0 / .22) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
.scan::after { content: ""; position: absolute; left: 0; right: 0; height: 22%; top: -22%; background: linear-gradient(180deg, transparent, rgb(255 255 255 / .12), transparent); animation: scanmove 3.4s linear infinite; }
@keyframes scanmove { to { top: 110%; } }
@media (prefers-reduced-motion: reduce) { .lockicon, .lockicon *, .scan::after { animation: none !important; } }
.panel > *, .info, .info > *, .media, .media > * { min-width: 0; }
.media { margin: 14px 0 0; display: grid; gap: 12px; }
.media, .ov, .ovscroll { max-width: 100%; }
.player { display: flex; align-items: center; gap: 10px; }
.play { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--ink-2); background: var(--surface); font-size: 14px; line-height: 1; }
.play:hover { border-color: var(--ink); }
.pbar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--ink); }
.ptime { font: 500 12px/1 var(--mono); color: var(--ink-2); min-width: 3.2em; text-align: right; }
.ov { margin: 0; }
.cdir { margin-bottom: 6px; }
.cdir button { padding: 5px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; }
.cdir button:hover { border-color: var(--ink-2); }
.cview { height: 460px; overflow-y: auto; border-radius: 8px; background: #05070d; overscroll-behavior: contain; position: relative; }
.cspace { position: relative; }
.cview canvas { position: sticky; top: 0; display: block; }
.ovscroll { max-height: 460px; overflow-y: auto; border-radius: 8px; background: #0e1220; text-align: center; overscroll-behavior: contain; }
.ovscroll img { display: block; width: 300px; max-width: 100%; height: auto; margin: 0 auto; }
.ov figcaption { margin-top: 6px; color: var(--ink-2); font-size: 12px; }
.relock { margin: 10px 0 0; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink-2); font-size: 13px; }
.relock:hover { border-color: var(--ink-2); color: var(--ink); }
.pwrow { display: flex; gap: 8px; }
.lockerr { min-height: 1.4em; margin: 8px 0 0; color: #c0392b; font-size: 13px; }
.unlock:hover { border-color: var(--ink); }
.tags2 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 500 11px/1.5 var(--mono); color: var(--ink-2); }
.tags2 .vtag { padding: 0 7px; border-radius: 99px; background: var(--vc); color: var(--on-v); font-weight: 600; }
.tags2 .xt { padding: 0 6px; border: 1px solid var(--ink-2); border-radius: 99px; letter-spacing: .04em; }
.body { display: grid; gap: 8px; padding: 10px 12px 12px; }
.t { margin: 0; min-height: 2.6em; font-weight: 700; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.t .sub { font-weight: 400; font-size: 12px; color: var(--ink-2); }
.stats { display: grid; gap: 6px; padding-top: 8px; border-top: 1px dashed var(--line); }
.cst { display: grid; line-height: 1; }
.cst small { font: 500 10px/1 var(--mono); color: var(--ink-2); letter-spacing: .06em; margin-bottom: 3px; }
.cst b { font: 700 28px/1 var(--display); font-variant-numeric: tabular-nums; }
.mini { min-width: 0; text-align: left; font: 400 11px/1.5 var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.mini span { display: block; white-space: nowrap; }
.mini .row2 { display: flex; justify-content: space-between; gap: 8px; }
.mini .row2 b { font-weight: 400; }

/* table */
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; min-width: 720px; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 500 11px/1.2 var(--mono); letter-spacing: .06em; color: var(--ink-2); background: var(--surface-2); }
th button { border: 0; background: none; padding: 0; font: inherit; letter-spacing: inherit; color: inherit; }
th[aria-sort="ascending"] button::after { content: " ▲"; } th[aria-sort="descending"] button::after { content: " ▼"; }
th[aria-sort] { color: var(--ink); }
td.num, th.num { text-align: right; }
td.nm { white-space: normal; min-width: 220px; overflow-wrap: anywhere; }
td.nm button { border: 0; background: none; padding: 0; text-align: left; font-weight: 700; }
td.nm button:hover { text-decoration: underline; }
td.nm .sub { display: block; font-weight: 400; font-size: 12px; color: var(--ink-2); }
tr.row { cursor: pointer; } tr.row:hover td { background: var(--bg); }
tr:last-child td { border-bottom: 0; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: var(--vc); }
.cn { font: 700 16px/1 var(--display); }

.empty { display: grid; justify-items: center; gap: 10px; padding: 48px 16px; color: var(--ink-2); text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }
.empty button { height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.foot { color: var(--ink-2); font-size: 12px; }

/* detail */
.veil { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgb(8 10 20 / .62); }
.panel { --vc: var(--ink-2); position: relative; width: min(860px, 100%); max-height: calc(100% - 8px); overflow: auto; display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 22px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.panel[data-v="1"] { --vc: var(--v1); } .panel[data-v="2"] { --vc: var(--v2); } .panel[data-v="3"] { --vc: var(--v3); }
.panel .art { border-radius: 10px; }
.panel .ini { font-size: clamp(72px, 14vw, 120px); }
.x-btn { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 50%; background: var(--bg); font-size: 16px; line-height: 1; }
.info { display: grid; align-content: start; gap: 14px; min-width: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; padding-right: 44px; }
.tag { padding: 2px 9px; border-radius: 99px; font: 600 12px/1.6 var(--mono); background: var(--vc); color: var(--on-v); }
.tag.o { background: transparent; color: var(--ink); border: 1px solid var(--ink-2); }
.info h2 { margin: 0; font: 700 clamp(22px, 4vw, 30px)/1.2 var(--display); overflow-wrap: anywhere; text-wrap: balance; }
.info h2 + p { margin: -8px 0 0; color: var(--ink-2); overflow-wrap: anywhere; }
.big { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.big .cst b { font-size: 56px; }
.big .cst small { font-size: 11px; }
.big .rank { color: var(--ink-2); font: 400 12px/1.5 var(--mono); padding-bottom: 6px; }
dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; margin: 0; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
dl div { padding: 9px 12px; background: var(--surface); min-width: 0; }
dt { font: 500 11px/1.3 var(--mono); letter-spacing: .06em; color: var(--ink-2); }
dd { margin: 2px 0 0; font: 500 16px/1.3 var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
dd small { font-size: 12px; color: var(--ink-2); }
.scale h3 { margin: 0 0 6px; font: 500 11px/1.3 var(--mono); letter-spacing: .06em; color: var(--ink-2); font-weight: 500; }
.track { position: relative; height: 40px; border-bottom: 1px solid var(--ink-2); }
.track i { position: absolute; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--vc); opacity: .55; }
.track i[data-v="1"] { --vc: var(--v1); } .track i[data-v="2"] { --vc: var(--v2); } .track i[data-v="3"] { --vc: var(--v3); }
.track i.me { opacity: 1; width: 12px; height: 12px; margin-left: -6px; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); z-index: 2; }
.ticks { position: relative; height: 18px; font: 400 10px/18px var(--mono); color: var(--ink-2); }
.ticks span { position: absolute; transform: translateX(-50%); }
.nav { display: flex; justify-content: space-between; gap: 8px; }
.nav button { height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.nav button:disabled { opacity: .4; cursor: default; }

@media (max-width: 640px) {
  .panel { grid-template-columns: minmax(0, 1fr); padding: 16px; }
  .panel .art { max-width: 260px; }
  .big .cst b { font-size: 48px; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>

<div class="wrap">
  <header class="head">
    <div>
      <p class="eyebrow" id="edition"></p>
      <h1>譜面資料庫</h1>
    </div>
    <div class="vers" id="vers" role="group" aria-label="依版本篩選"></div>
  </header>

  <div class="bar" role="search">
    <input class="search" id="q" type="search" placeholder="搜尋曲名" aria-label="搜尋曲名" autocomplete="off">
    <div class="seg" id="kind" role="group" aria-label="篇別">
      <button type="button" data-k="all" aria-pressed="true">全部</button>
      <button type="button" data-k="Master" aria-pressed="false">Master</button>
      <button type="button" data-k="Extra" aria-pressed="false">Extra</button>
    </div>
    <select class="sel" id="lvl" aria-label="難易度"></select>
    <select class="sel" id="sort" aria-label="排序"></select>
    <div class="seg" id="view" role="group" aria-label="檢視方式">
      <button type="button" data-m="grid" aria-pressed="true">卡片</button>
      <button type="button" data-m="table" aria-pressed="false">表格</button>
    </div>
  </div>

  <div class="meta"><span id="count"></span><span>定數為估計值</span></div>
  <main id="out"><div class="empty"><p>載入中…</p></div></main>
  <p class="foot" id="foot"></p>
</div>

<div class="veil" id="veil" hidden>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="dtitle"></div>
</div>

<script>
function prep(s) {
  const nums = (String(s.bpm ?? "").match(/\d+(?:\.\d+)?/g) || []).map(Number);
  const [mm, ss] = s.dur ? String(s.dur).split(":").map(Number) : [0, 0];
  return { sub: "", meter: "", kind: "Master", level: null, constant: null, bpm: null, dur: null, notes: null, ...s,
    full: s.title + " " + (s.sub || ""),
    bpmHi: nums.length ? Math.max(...nums) : null,
    sec: s.dur ? mm * 60 + ss : null };
}
function init(DATA) {
const SONGS = DATA.songs.map(prep);
const SECRET_PREFIX = "chartdb-secret-";
const secKey = s => SECRET_PREFIX + s.id + ":" + String(s.enc.d).slice(0, 16);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptPayload(enc, pass) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(enc.s), iterations: 250000, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.i) }, key, b64(enc.d));
  return JSON.parse(new TextDecoder().decode(buf));
}
const RELOCK_PREFIX = "chartdb-relocked-";
function setRelocked(id, v) { try { v ? localStorage.setItem(RELOCK_PREFIX + id, "1") : localStorage.removeItem(RELOCK_PREFIX + id); } catch (e) {} }

          if (ic) ic.classList.add("open");
          $("unlock").disabled = true; await sleep(750); reunlock(s);
        } else {
          await unlock(s, $("pw").value, async () => { if (ic) ic.classList.add("open"); $("pw").disabled = $("unlock").disabled = true; await sleep(750); });
        }
        justUnlocked = id; render(); open(id);
      } catch (e) {
        $("lockerr").textContent = "密碼不對。";
        if (ic) { ic.classList.remove("nope"); void ic.getBoundingClientRect(); ic.classList.add("nope"); }
      }
    };
    $("unlock").onclick = go;
    if ($("pw")) $("pw").onkeydown = e => { if (e.key === "Enter") go(); };
  }
  if (prev) $("prev").onclick = () => open(prev.id);
  if (next) $("next").onclick = () => open(next.id);
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
}
function close() {
  stopAudio();
  $("veil").hidden = true; current = null;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  if (opener && document.contains(opener)) opener.focus(); opener = null;
}

/* wiring */
$("edition").textContent = EDITION;
$("foot").textContent = `${EDITION} · 共 ${SONGS.length} 筆（Master 篇 ${SONGS.filter(s => s.kind === "Master").length}、Extra 篇 ${SONGS.filter(s => s.kind === "Extra").length}）`;
$("vers").innerHTML = [1, 2, 3].map(v => {
  const l = SONGS.filter(s => s.ver === v), cs = l.map(s => s.constant).filter(c => c != null);
  return `<button type="button" class="ver" data-v="${v}" aria-pressed="false"><b>${VNAME[v]}</b><span>${l.length} 首 · ${cs.length ? fmtC(Math.min(...cs)) + "–" + fmtC(Math.max(...cs)) : "未定"}</span></button>`;
}).join("");
$("lvl").innerHTML = `<option value="all">全部難易度</option>` + [...new Set(SONGS.map(s => s.level).filter(l => l != null))].sort((a, b) => a - b).map(l => `<option value="${l}">Lv.${l}</option>`).join("");
$("sort").innerHTML = SORTS.map(([v, t]) => `<option value="${v}">${t}</option>`).join("");

$("vers").addEventListener("click", e => { const b = e.target.closest(".ver"); if (!b) return; const v = +b.dataset.v; S.ver = S.ver === v ? 0 : v; sync(); render(); });
$("kind").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.kind = b.dataset.k; sync(); render(); });
$("view").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.view = b.dataset.m; try { localStorage.setItem("chartdb-view", S.view); } catch (x) {} sync(); render(); });
$("lvl").addEventListener("change", e => { S.level = e.target.value; render(); });
$("sort").addEventListener("change", e => { const [k, d] = e.target.value.split("-"); S.key = k; S.dir = d === "asc" ? 1 : -1; sync(); render(); });
$("q").addEventListener("input", e => { S.q = e.target.value; render(); });
$("out").addEventListener("click", e => {
  const h = e.target.closest("[data-sort]");
  if (h) { const k = h.dataset.sort; if (S.key === k) S.dir = -S.dir; else { S.key = k; S.dir = k === "title" ? 1 : -1; } sync(); render(); return; }
  const c = e.target.closest("[data-id]");
  if (c) open(c.dataset.id, c.querySelector("button") || c);
});
$("veil").addEventListener("click", e => { if (e.target === $("veil")) close(); });
document.addEventListener("keydown", e => {
  if ($("veil").hidden) return;
  if (e.target && e.target.tagName === "INPUT" && e.key !== "Escape") return;
  if (e.key === "Escape") close();
  else if (e.key === "ArrowLeft" && $("prev") && !$("prev").disabled) $("prev").click();
  else if (e.key === "ArrowRight" && $("next") && !$("next").disabled) $("next").click();
});
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (byId[id] && id !== current) open(id); });

sync(); render();
{ const id = location.hash.slice(1); if (byId[id]) open(id); }
}
fetch("songs.json", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(init)
  .catch(err => {
    document.getElementById("out").innerHTML = '<div class="empty"><p>資料載入失敗，請重新整理頁面。</p><p>' + String((err && err.message) || err) + '</p></div>';
  });
</script>
